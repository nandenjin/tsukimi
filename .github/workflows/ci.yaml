name: CI

on:
  push:
    branches: ['dev', 'renovate/*']
  pull_request:
    branches: ['dev', '!renovate/*']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.3
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-dist
          path: dist
